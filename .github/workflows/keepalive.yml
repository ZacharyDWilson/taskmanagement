name: Keep Supabase awake

# Free Supabase projects pause after about a week with no activity. This pings the database every
# 3 days so the project stays awake through breaks. Uses the same two secrets as the deploy workflow.
on:
  schedule:
    - cron: '17 12 */3 * *'   # 12:17 UTC, every 3rd day of the month (never more than 3 days apart)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keepalive function
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
